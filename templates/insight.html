<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | World Insight</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="../index.html">WORLD INSIGHT</a><span class="brand-note">理解は、判断より先にある。</span></header>
  <main>
    <header class="hero hero-question-first">
      <p class="mission">世界には、答えより問いがある。</p>
      <p class="date">{{ date }}　·　10〜12分</p>
      <p class="eyebrow">Today's Decision</p>
      <h1>{{ title }}</h1>
      <div class="hero-question-block"><span>Today's Question</span><p>{{ question }}</p></div>
      <p class="hero-context">ニュースを材料に、読者が複数の責任と選択肢を考えるためのInsightです。</p>
    </header>
    <article class="article generated-body">{{ body }}</article>
  </main>
  <footer class="site-footer">World Insight — 問いを届け、理解を育て、判断を支える。</footer>
</body>
</html>
